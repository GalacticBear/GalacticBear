name: Refresh GitHub profile statistics

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Prevent two scheduled/manual refreshes from running at the same time.
concurrency:
  group: profile-statistics
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Generate GitHub statistics
        env:
          GH_LOGIN: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/generate_stats.py

      - name: Commit generated statistics when changed
        run: |
          FILES="assets/stats.svg assets/streak.svg assets/languages.svg assets/contributions.svg"

          if [ -z "$(git status --porcelain -- $FILES)" ]; then
            echo "No generated changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- $FILES
          git commit -m "chore: refresh profile stats"
          git push
